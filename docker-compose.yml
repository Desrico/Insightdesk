services:
  mysql:
    image: mysql:8.0
    container_name: insightdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: insightdesk
      MYSQL_USER: insightdesk_user
      MYSQL_PASSWORD: insightdesk_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightdesk_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: insightdesk
      DB_USERNAME: insightdesk_user
      DB_PASSWORD: insightdesk_password
    depends_on:
      - mysql
    command: sh -c "composer install && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightdesk_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  mysql_data: