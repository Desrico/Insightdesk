services:
  mysql:
    image: mysql:8.0
    container_name: insightdesk_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: insightdesk
      MYSQL_USER: insightdesk_user
      MYSQL_PASSWORD: insightdesk_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insightdesk_backend
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: insightdesk
      DB_USERNAME: insightdesk_user
      DB_PASSWORD: insightdesk_password
      CACHE_STORE: database
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "test -f .env || cp .env.example .env;
      test -f vendor/autoload.php || composer install --no-interaction --no-progress;
      grep -q '^APP_KEY=base64:' .env || php artisan key:generate --force;
      php artisan migrate --force;
      php artisan serve --host=0.0.0.0 --port=8000"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/up > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insightdesk_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "test -d node_modules || npm install; npm run dev -- --host 0.0.0.0"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

volumes:
  mysql_data:
